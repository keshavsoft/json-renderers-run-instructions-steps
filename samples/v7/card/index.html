<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V13 — Card Step Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: system-ui, -apple-system, sans-serif; }
        .hero-banner {
            background: linear-gradient(135deg, #162533 0%, #0d1723 100%);
            color: #edf3f9;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="hero-banner">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-primary px-3 py-2">V13 Step Runner</span>
                <a href="../index.html" class="btn btn-sm btn-outline-light">&larr; All Samples</a>
            </div>
            <h1 class="h3 fw-bold mb-2">Cards via <code>applyTemplate</code> &amp; <code>multi</code></h1>
            <p class="text-light-50 small mb-0">Side-by-side comparison: two <code>single</code> steps vs one <code>{ type: "multi", key: "card-with-footer" }</code> step.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <h2 class="h6 text-uppercase fw-bold text-secondary mb-3">Built with 2 Single Steps</h2>
                <div id="dom-card-single"></div>
            </div>
            <div class="col-md-6">
                <h2 class="h6 text-uppercase fw-bold text-secondary mb-3">Built with 1 Multi Step</h2>
                <div id="dom-card-multi"></div>
            </div>
        </div>
    </main>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
