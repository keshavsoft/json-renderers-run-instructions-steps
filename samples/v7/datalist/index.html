<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V13 — DataList Step Runner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .hero-banner {
            background: linear-gradient(135deg, #162533 0%, #0d1723 100%);
            color: #edf3f9;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="hero-banner">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-info text-dark px-3 py-2">V13 Step Runner</span>
                <a href="../index.html" class="btn btn-sm btn-outline-light">&larr; All Samples</a>
            </div>
            <h1 class="h3 fw-bold mb-2">DataList Autocomplete via <code>columnOnRow</code></h1>
            <p class="text-light-50 small mb-0">Running <code>{ type: "single", key: "buildDataListWithOptions" }</code> and binding inputs by <code>list</code> id.</p>
        </div>

        <div class="card shadow-sm border-0 p-4 mb-3">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="dl-itemName" class="form-label fw-semibold">Item Name</label>
                    <input id="dl-itemName" list="itemName" class="form-control" placeholder="Type or pick item...">
                </div>
                <div class="col-md-4">
                    <label for="dl-category" class="form-label fw-semibold">Category</label>
                    <input id="dl-category" list="category" class="form-control" placeholder="Type or pick category...">
                </div>
                <div class="col-md-4">
                    <label for="dl-baseUnit" class="form-label fw-semibold">Base Unit</label>
                    <input id="dl-baseUnit" list="baseUnit" class="form-control" placeholder="Type or pick unit...">
                </div>
            </div>
        </div>

        <div id="dom-render-container" class="mt-3"></div>
    </main>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
