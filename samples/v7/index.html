<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V13 Showcase Menu — json-renderers-run-instructions-steps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .hero-banner {
            background: linear-gradient(135deg, #162533 0%, #0d1723 100%);
            color: #edf3f9;
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 28px;
        }

        .code-pill {
            background: rgba(90, 169, 255, 0.15);
            border: 1px solid rgba(90, 169, 255, 0.4);
            color: #5aa9ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: 600;
        }
    </style>
</head>

<body class="bg-light">
    <main class="container py-4">
        <div class="hero-banner">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <span class="badge bg-primary px-3 py-2">V13 Modular Step Runner Showcase</span>
                <span class="badge bg-success-subtle text-success px-3 py-2">single + multi + declarative-spec v4</span>
            </div>
            <h1 class="h3 fw-bold mb-2">Declarative UI Gallery built with <span class="code-pill">v13</span></h1>
            <p class="text-light-50 small mb-0">
                This menu itself is built declaratively using <code>buildMenuItems</code> and <code>buildMenuCards</code> from <code>declarative-instructions-single</code>.
            </p>
        </div>

        <div class="row g-4">
            <aside class="col-lg-3">
                <h2 class="h6 text-uppercase fw-bold text-secondary mb-3">Quick Nav</h2>
                <div id="dom-menu-nav"></div>
            </aside>
            <section class="col-lg-9">
                <h2 class="h6 text-uppercase fw-bold text-secondary mb-3">Component Demos</h2>
                <div id="dom-render-container"></div>
            </section>
        </div>
    </main>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
